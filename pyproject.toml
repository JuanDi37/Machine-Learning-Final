[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "desempeno-ventas"
version = "0.1.0"
description = "Reto 1: desempeño comercial y pronóstico de ventas con CRISP-DM"
requires-python = ">=3.12,<3.14"
dependencies = [
  "kedro>=1.0,<2", "kedro-datasets>=8,<10",
  "pandas>=2.2,<3", "numpy>=2,<3", "scikit-learn>=1.6,<2",
  "optuna>=4,<5", "matplotlib>=3.9,<4", "PyYAML>=6,<7",
  "threadpoolctl>=3,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "nbformat>=5,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8"]

[tool.kedro]
package_name = "ventas"
project_name = "Desempeño de ventas"
kedro_init_version = "1.0.0"
source_dir = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

